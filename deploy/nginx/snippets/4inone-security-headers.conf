# Sicherheits-Header für alle Angular-Seiten und -Dateien. Als eigene Datei, weil nginx die add_header-Zeilen des
# server-Blocks verwirft, sobald eine location eigene add_header setzt — so gilt in jeder location derselbe Satz.
# /api/ setzt Django selbst (config/settings.py, DEBUG=False).
#
# script-src bleibt strikt 'self': im Build gibt es kein Inline-Skript (angular.json › inlineCritical: false,
# app.config.ts › withNoIncrementalHydration). style-src braucht 'unsafe-inline' für Angulars Komponenten-Stile.
# connect-src 'self': die API liegt unter derselben Adresse (environment.production.ts › apiOrigin '').
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
