# Weiterleitung an gunicorn (backend/requirements.txt: --bind 127.0.0.1:8000).
# X-Forwarded-For bewusst nur mit der echten Gegenstelle ($remote_addr), nicht angehängt: so kann niemand eine
# gefälschte IP voranstellen (Django: BEHIND_PROXY=True → NUM_PROXIES=1 für Rate-Limits und Login-Sperre).
proxy_pass http://127.0.0.1:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Connection "";
proxy_read_timeout 30s;
proxy_redirect off;
