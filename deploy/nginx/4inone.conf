# 4inOne — nginx vor Angular (statisch) und Django (gunicorn auf 127.0.0.1:8000).
# Einbinden in den http-Block, z. B. als /etc/nginx/sites-available/4inone.conf. Vor dem Einsatz anpassen:
#   4inone.example   → eigene Domain (auch in den Zertifikatspfaden)
#   /srv/4inone-web  → Ort der gebauten Seite (Inhalt von frontend/dist/frontend/browser, siehe deploy/scripts/update.sh)
#   DJANGO_ADMIN     → Wert von ADMIN_URL_PATH aus der .env (ohne Schrägstriche)
# Django dazu mit BEHIND_PROXY=True starten (genau dieser eine Proxy davor), siehe docs/GO_LIVE.md.
# Prüfen: `nginx -t`, danach z. B. https://securityheaders.com und `curl -I https://4inone.example/`.

# Startseite: Besucher bekommen die vorgerenderte Landingpage, Angemeldete die normale App. Das Hinweis-Cookie
# setzt die App selbst (frontend/src/app/core/auth/auth.service.ts › SIGNED_IN_HINT); es enthält nur „1“, kein
# Geheimnis — wer es fälscht, sieht lediglich die leere App und landet beim Login.
map $cookie_4io_signed_in $fourinone_home {
    "1"     /index.csr.html;
    default /index.html;
}

# HTML nie ungeprüft aus dem Cache (sonst verweist es nach einem Update auf gelöschte Dateien)
map $sent_http_content_type $fourinone_html_cache {
    ~^text/html "no-cache";
    default     "";
}

server {
    listen 80;
    listen [::]:80;
    server_name 4inone.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 4inone.example;

    ssl_certificate     /etc/letsencrypt/live/4inone.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/4inone.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    server_tokens off;
    charset utf-8;
    root /srv/4inone-web;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;

    # Keine versteckten Dateien (.git, .env …), falls je etwas daneben liegt
    location ~ /\. {
        return 404;
    }

    # ---------- Django: API und Admin ----------
    location /api/ {
        include /etc/nginx/snippets/4inone-proxy.conf;
        # Organisation › Dateien erlaubt 10 MB je Datei (backend/organisation/files.py), dazu etwas Formular-Rahmen
        client_max_body_size 12m;
    }
    location /DJANGO_ADMIN/ {
        include /etc/nginx/snippets/4inone-proxy.conf;
        # Empfohlen: nur aus dem eigenen Netz/VPN
        # allow 203.0.113.0/24;
        # deny all;
    }

    # ---------- Angular ----------
    # Startseite: siehe map $fourinone_home oben. Vary, damit kein Zwischenspeicher die Varianten vertauscht.
    location = / {
        include /etc/nginx/snippets/4inone-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Vary "Cookie" always;
        try_files $fourinone_home =404;
    }

    # Gebaute Dateien mit Inhalts-Hash im Namen (main-XXXX.js, chunk-XXXX.js, styles-XXXX.css): ändern sich nie
    location ~ ^/(?:main|chunk|polyfills|styles)-[A-Za-z0-9_-]{8}\.(?:js|css)$ {
        include /etc/nginx/snippets/4inone-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Schrift, Bilder, Icons: ohne Hash im Namen — ein Tag, danach neu prüfen
    location ~ ^/(?:fonts|images)/ {
        include /etc/nginx/snippets/4inone-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Vorgerenderte Seiten (/impressum → /impressum/index.html), sonst die App-Datei für alle App-Adressen.
    # Kein `$uri/` — das würde auf /impressum/ umleiten.
    location / {
        include /etc/nginx/snippets/4inone-security-headers.conf;
        add_header Cache-Control $fourinone_html_cache always;
        try_files $uri $uri/index.html /index.csr.html;
    }
}
