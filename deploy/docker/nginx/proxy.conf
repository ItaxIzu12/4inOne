# Weiterleitung an gunicorn im Container „backend“ (Docker-Variante von deploy/nginx/snippets/4inone-proxy.conf).
# X-Forwarded-For bewusst nur mit der echten Gegenstelle: so kann niemand eine gefälschte IP voranstellen
# (Django: BEHIND_PROXY=True → genau ein Proxy davor, für Rate-Limits und Login-Sperre).
proxy_pass http://backend:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header Connection "";
proxy_read_timeout 30s;
proxy_redirect off;
