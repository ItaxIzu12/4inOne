<app-public-shell>
  <div class="legal">
    <!-- Zwischen den vier Rechtsseiten wechseln; am Handy als wischbare Leiste über dem Text -->
    <nav class="legal__nav" aria-label="Rechtliche Seiten">
      <p class="legal__nav-head" aria-hidden="true">Rechtliches</p>
      @for (page of pages; track page.path) {
        <a [routerLink]="page.path" routerLinkActive="is-current" ariaCurrentWhenActive="page">{{ page.label }}</a>
      }
    </nav>

    <article class="legal-page">
      <h1>{{ title() }}</h1>

      <div class="legal-warning">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 9v4M12 17h.01" />
          <path d="M10.3 3.9 2.5 17a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" />
        </svg>
        <p>
          <strong>Platzhaltertext</strong> — noch nicht rechtsverbindlich. Er wird vor dem Start rechtlich geprüft und ersetzt.
        </p>
      </div>

      <div class="legal-page__content">
        <ng-content />
      </div>

      <a class="back-link" routerLink="/">← Zurück zum Start</a>
    </article>
  </div>
</app-public-shell>
