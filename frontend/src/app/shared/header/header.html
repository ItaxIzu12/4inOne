<header class="header" [class.menu-open]="menuOpen()">
  <div class="header-inner">
    <a class="brand" routerLink="/" aria-label="Kompass — zum Start" (click)="goHome()">
      <span class="brand-mark">K</span>
      <span class="brand-name">Kompass</span>
    </a>

    <nav class="site-nav" aria-label="Hauptnavigation">
      @for (s of sections; track s.key) {
        <a class="nav-link" [class]="'m-' + s.key" [href]="s.href" (click)="closeMenu()">{{ s.label }}</a>
      }
      <a class="nav-link nav-login" routerLink="/login" (click)="closeMenu()">Anmelden</a>
    </nav>

    <div class="header-actions">
      <button
        type="button"
        class="theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Zu hellem Modus wechseln' : 'Zu dunklem Modus wechseln'"
      >
        @if (theme.theme() === 'dark') {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        } @else {
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        }
      </button>

      <a class="login-button" routerLink="/login">Anmelden</a>

      <button
        type="button"
        class="menu-toggle"
        (click)="toggleMenu()"
        aria-controls="mobile-nav"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? 'Menü schließen' : 'Menü öffnen'"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          @if (menuOpen()) {
            <path d="M5 5l14 14M19 5L5 19"/>
          } @else {
            <path d="M4 7h16M4 12h16M4 17h16"/>
          }
        </svg>
      </button>
    </div>
  </div>
</header>
