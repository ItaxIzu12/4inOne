<header class="header">
  <div class="header-inner">
    <a class="brand" routerLink="/" aria-label="Kompass — zum Start" (click)="goHome()">
      <logo-kompass class="brand-mark" />
      <span class="brand-name">Kompass</span>
    </a>

    @if (showDashboardNav()) {
      <nav class="header-nav" aria-label="Hauptnavigation">
        <a
          routerLink="/"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          #rlaStart="routerLinkActive"
          [attr.aria-current]="rlaStart.isActive ? 'page' : null"
        >
          <svg class="kompass-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
          Start
        </a>
        <a routerLink="/finanzen" routerLinkActive="is-active" #rlaFin="routerLinkActive" [attr.aria-current]="rlaFin.isActive ? 'page' : null">
          <icon-finanzen class="kompass-icon" />
          Finanzen
        </a>
        <a routerLink="/haushalt" routerLinkActive="is-active" #rlaHh="routerLinkActive" [attr.aria-current]="rlaHh.isActive ? 'page' : null">
          <icon-haushalt class="kompass-icon" />
          Haushalt
        </a>
        <a routerLink="/organisation" routerLinkActive="is-active" #rlaOrg="routerLinkActive" [attr.aria-current]="rlaOrg.isActive ? 'page' : null">
          <icon-organisation class="kompass-icon" />
          Organisation
        </a>
      </nav>
    }

    <div class="header-actions">
      <button
        type="button"
        class="theme-toggle"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Zu hellem Modus wechseln' : 'Zu dunklem Modus wechseln'"
      >
        @if (theme.theme() === 'dark') {
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        } @else {
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        }
      </button>

      @if (auth.isAuthenticated()) {
        <a class="profile-link" routerLink="/einstellungen" aria-label="Einstellungen">
          <span class="profile-avatar" aria-hidden="true">{{ initials() }}</span>
        </a>
      } @else {
        <a class="login-button" routerLink="/login">Anmelden</a>
      }
    </div>
  </div>
</header>
