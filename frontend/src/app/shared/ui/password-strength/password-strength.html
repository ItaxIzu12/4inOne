<div class="meter-row">
  <div class="meter" [attr.data-score]="check().score" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <span class="strength-label" [attr.data-score]="check().score" aria-live="polite">
    @if (check().score) {<span class="sr-only">Passwortstärke: </span>}{{ label() }}
  </span>
</div>
<ul class="rules" [id]="rulesId()">
  @for (rule of rules(); track rule.text) {
    <li [class.is-met]="rule.met"><span class="rule-mark" aria-hidden="true">@if (rule.met) {<app-icon name="check" />}</span>{{ rule.text }}<span class="sr-only">{{ rule.met ? ' – erfüllt' : ' – offen' }}</span></li>
  }
</ul>
<p class="rules__alt" [class.is-met]="check().passphrase">
  <app-icon [name]="check().passphrase ? 'check' : 'info'" aria-hidden="true" />
  <span>Oder eine Passphrase ab {{ passphraseLength }} Zeichen, z. B. vier Wörter mit Leerzeichen und einer Zahl.</span>
</p>
