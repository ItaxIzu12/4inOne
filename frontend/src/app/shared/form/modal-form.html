<app-modal [open]="open()" [labelledBy]="titleId" [closeLabel]="closeLabel()" [flush]="true" (closed)="closed.emit()">
  <form class="modal-form" novalidate (submit)="onSubmit($event)">
    <header class="modal-form__head">
      @if (icon(); as name) {
        <span class="modal-form__icon" aria-hidden="true"><app-icon [name]="name" /></span>
      }
      <h2 [id]="titleId">{{ title() }}</h2>
    </header>

    <div class="modal-form__body">
      <ng-content />
    </div>

    <footer class="modal-form__foot">
      @if (error()) {
        <p class="modal-form__error" role="alert">{{ error() }}</p>
      }
      @if (confirmingDelete()) {
        <div class="modal-form__confirm">
          <p>Wirklich löschen? Das lässt sich nicht rückgängig machen.</p>
          <div class="modal-form__actions">
            <button type="button" class="mf-btn mf-btn--danger" [disabled]="saving()" (click)="confirmDelete()">
              Ja, löschen
            </button>
            <button type="button" class="mf-btn mf-btn--soft" (click)="confirmingDelete.set(false)">Behalten</button>
          </div>
        </div>
      } @else {
        <div class="modal-form__actions">
          @if (deleteLabel()) {
            <button type="button" class="mf-link" [disabled]="saving()" (click)="confirmingDelete.set(true)">
              <app-icon name="trash" />{{ deleteLabel() }}
            </button>
          }
          <span class="modal-form__spacer"></span>
          <button type="button" class="mf-btn mf-btn--soft" [disabled]="saving()" (click)="closed.emit()">
            {{ cancelLabel() }}
          </button>
          <button type="submit" class="mf-btn mf-btn--primary" [disabled]="saving()" [attr.aria-busy]="saving()">
            @if (saving()) {
              <span class="mf-spinner" aria-hidden="true"></span>
            }
            {{ saving() ? 'Wird gespeichert …' : submitLabel() }}
          </button>
        </div>
      }
    </footer>
  </form>
</app-modal>
