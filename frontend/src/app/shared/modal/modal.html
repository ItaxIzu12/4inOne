@if (open()) {
  <!-- mousedown nicht abbrechen zu lassen würde den Fokus aus dem Dialog nehmen (Escape ginge dann ins Leere) -->
  <div class="modal-backdrop" (mousedown)="$event.preventDefault()" (click)="onBackdropClick()"></div>
  <div
    #panel
    class="modal-panel"
    [class.modal-panel--flush]="flush()"
    [class.modal-panel--nudge]="nudge()"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="labelledBy()"
    (keydown)="onKeydown($event)"
  >
    <ng-content />
    <button type="button" class="modal-close" [attr.aria-label]="closeLabel()" (click)="requestClose()">
      <icon-close />
    </button>
  </div>
}
