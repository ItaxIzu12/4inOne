<app-save-feedback [message]="saveMessage()" (dismissed)="dismissSaved()" />
<div class="hh-page">
  <app-sidebar-nav />

  <div class="hh-page__content">
    <app-context-bar />
    <main id="main-content" class="hh-main">
      <header class="page-head">
        <h1>Euer Haushalt</h1>
        <p class="page-subtitle">Einkaufen, Aufgaben und wichtige Fristen – für alle sichtbar.</p>
      </header>

      <div class="subtabs" role="tablist" aria-label="Bereiche im Haushalt" (keydown)="onTabKeydown($event)">
        <button
          id="hh-tab-einkauf"
          type="button"
          role="tab"
          class="subtab"
          aria-controls="hh-panel"
          [attr.aria-selected]="activeTab() === 'einkauf'"
          [attr.tabindex]="activeTab() === 'einkauf' ? 0 : -1"
          [class.is-active]="activeTab() === 'einkauf'"
          (click)="selectTab('einkauf')"
        >
          Einkauf
        </button>
        <button
          id="hh-tab-aufgaben"
          type="button"
          role="tab"
          class="subtab"
          aria-controls="hh-panel"
          [attr.aria-selected]="activeTab() === 'aufgaben'"
          [attr.tabindex]="activeTab() === 'aufgaben' ? 0 : -1"
          [class.is-active]="activeTab() === 'aufgaben'"
          (click)="selectTab('aufgaben')"
        >
          Aufgaben
        </button>
        <button
          id="hh-tab-ordner"
          type="button"
          role="tab"
          class="subtab"
          aria-controls="hh-panel"
          [attr.aria-selected]="activeTab() === 'ordner'"
          [attr.tabindex]="activeTab() === 'ordner' ? 0 : -1"
          [class.is-active]="activeTab() === 'ordner'"
          (click)="selectTab('ordner')"
        >
          Ordner
        </button>
      </div>

      <div id="hh-panel" role="tabpanel" [attr.aria-labelledby]="'hh-tab-' + activeTab()">
        @switch (activeTab()) {
          @case ('einkauf') {
            <app-einkauf-tab (saved)="showSaved($event)" />
          }
          @case ('aufgaben') {
            <app-aufgaben-tab (saved)="showSaved($event)" />
          }
          @case ('ordner') {
            <app-ordner-tab (saved)="showSaved($event)" />
          }
        }
      </div>
    </main>
  </div>
</div>
