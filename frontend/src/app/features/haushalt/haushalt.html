<app-save-feedback [message]="saveMessage()" (dismissed)="dismissSaved()" />
<app-shell>
  <main id="main-content" class="hh-main domain-page" tabindex="-1">
    <div class="domain-sticky">
      <header class="page-head domain-heading">
        <span class="page-head__icon domain-icon" aria-hidden="true"><app-icon name="household" /></span>
        <div class="page-head__text">
          <h1>Haushalt</h1>
          <p class="page-subtitle">Wer was erledigt, was fehlt und welche Frist ansteht – gemeinsam im Blick.</p>
        </div>
        @if (headAction()) {
          <button type="button" class="btn-primary page-head__action" [attr.aria-label]="headAction()" (click)="headActionClick()">
            <app-icon name="plus" /> <span>{{ headAction() }}</span>
          </button>
        }
      </header>

      <div class="subtabs domain-tabs" role="tablist" aria-label="Bereiche im Haushalt" (keydown)="onTabKeydown($event)">
        @for (tab of tabs; track tab.key) {
          <button
            [id]="'hh-tab-' + tab.key"
            type="button"
            role="tab"
            class="subtab"
            aria-controls="hh-panel"
            [attr.aria-selected]="activeTab() === tab.key"
            [attr.tabindex]="activeTab() === tab.key ? 0 : -1"
            [class.is-active]="activeTab() === tab.key"
            (click)="selectTab(tab.key)"
          >
            <app-icon [name]="tab.icon" aria-hidden="true" />{{ tab.label }}
          </button>
        }
      </div>
    </div>

    <div id="hh-panel" role="tabpanel" [attr.aria-labelledby]="'hh-tab-' + activeTab()">
      @switch (activeTab()) {
        @case ('heute') {
          <app-uebersicht-tab
            (saved)="showSaved($event)"
            (openTab)="selectTab($event)"
            (openZuhause)="openZuhause($event)"
            (create)="createFromToday($event)"
          />
        }
        @case ('aufgaben') {
          <app-aufgaben-tab [newRequest]="newTaskRequest()" [view]="aufgabenView()" (viewChange)="setView($event)" (saved)="showSaved($event)" />
        }
        @case ('einkaufen') {
          <app-einkauf-tab [newRequest]="newTaskRequest()" (saved)="showSaved($event)" />
        }
        @case ('zuhause') {
          <app-ordner-tab [newRequest]="newTaskRequest()" [section]="zuhauseSection()" (sectionChange)="setSection($event)" (saved)="showSaved($event)" />
        }
      }
    </div>
    @if (headAction()) {
      <app-mobile-action [label]="headAction()" (pressed)="headActionClick()" />
    }
  </main>
</app-shell>
