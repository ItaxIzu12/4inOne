<app-save-feedback [message]="saveMessage()" (dismissed)="dismissSaved()" />
<app-shell>
  <main id="main-content" class="hh-main" tabindex="-1">
      <header class="page-head">
        <span class="page-head__icon" aria-hidden="true"><app-icon name="household" /></span>
        <div class="page-head__text">
          <h1>Haushalt</h1>
          <p class="page-subtitle">Organisiere dein Zuhause. Gemeinsam.</p>
        </div>
        <button type="button" class="btn-primary page-head__action" aria-label="Neue Aufgabe" (click)="newTask()">
          <app-icon name="plus" /> <span>Neue Aufgabe</span>
        </button>
      </header>

      <div class="subtabs" role="tablist" aria-label="Bereiche im Haushalt" (keydown)="onTabKeydown($event)">
        @for (tab of tabs; track tab.key) {
          <button
            [id]="'hh-tab-' + tab.key"
            type="button"
            role="tab"
            class="subtab"
            aria-controls="hh-panel"
            [attr.aria-selected]="activeTab() === tab.key"
            [attr.tabindex]="activeTab() === tab.key ? 0 : -1"
            [class.is-active]="activeTab() === tab.key"
            (click)="selectTab(tab.key)"
          >
            {{ tab.label }}
          </button>
        }
      </div>

      <div id="hh-panel" role="tabpanel" [attr.aria-labelledby]="'hh-tab-' + activeTab()">
        @switch (activeTab()) {
          @case ('uebersicht') {
            <app-uebersicht-tab (saved)="showSaved($event)" (openTab)="selectTab($event)" />
          }
          @case ('routinen') {
            <app-aufgaben-tab mode="routinen" [newRequest]="newTaskRequest()" (saved)="showSaved($event)" />
          }
          @case ('einkauf') {
            <app-einkauf-tab (saved)="showSaved($event)" />
          }
          @case ('aufgaben') {
            <app-aufgaben-tab [newRequest]="newTaskRequest()" (saved)="showSaved($event)" />
          }
          @case ('ordner') {
            <app-ordner-tab (saved)="showSaved($event)" />
          }
        }
      </div>
  </main>
</app-shell>
