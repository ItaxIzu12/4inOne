<section class="budget-year" aria-label="Monatsbudgets im Jahresüberblick">
  <div class="budget-year__head">
    <div>
      <h3>Dein Budgetjahr</h3>
      <p>{{ planned() }} von 12 Monaten geplant</p>
    </div>
    <div class="budget-year__select">
      <label for="budget-year-select">Jahr</label>
      <select id="budget-year-select" [value]="year()" (change)="changeYear($event)">
        @for (value of years(); track value) { <option [value]="value">{{ value }}</option> }
      </select>
    </div>
  </div>
  <p class="budget-year__help">Wähle einen Monat. Sein Budget kannst du oben ansehen und bearbeiten.</p>
  <ul class="budget-year__months">
    @for (row of months(); track row.month) {
      <li>
        <button type="button" class="budget-month"
          [class.is-selected]="row.month === month()"
          [attr.aria-pressed]="row.month === month()"
          [attr.aria-label]="row.name + ' ' + year() + ': ' + (row.budget ? money(row.budget.amount) : 'Noch nicht festgelegt') + (row.month === currentMonth ? ', aktueller Monat' : '')"
          (click)="monthPick.emit(row.month)">
          <span class="budget-month__name">{{ row.name }}
            @if (row.month === currentMonth) { <small>Aktuell</small> }
          </span>
          <span class="budget-month__value" [class.is-empty]="!row.budget">
            {{ row.budget ? money(row.budget.amount) : 'Nicht festgelegt' }}
          </span>
          <span class="budget-month__mark" aria-hidden="true">{{ row.month === month() ? '✓' : '›' }}</span>
        </button>
      </li>
    }
  </ul>
</section>
